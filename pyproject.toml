[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.1.0"
description = "An RL environment, eval harness and training pipeline that teaches small local agents judgment"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Outside benchmarks (alfred.external). Install in their own environment: they pin their own dependencies.
external = ["agentdojo>=0.1.35", "bfcl-eval>=2026.3.23", "soundfile"]
# Training (alfred.train). On a GPU machine with vLLM installed, this reuses vLLM's torch and transformers.
train = ["torch", "transformers>=4.56", "peft>=0.17", "accelerate", "safetensors", "huggingface_hub", "kernels"]

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.setuptools.package-data]
"alfred.app" = ["static/*.html", "static/fonts/*"]
"alfred.realism" = ["packs/*.jsonl", "packs/*.jsonl.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
