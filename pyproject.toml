[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.1.0"
description = "RL environment and eval harness for private, local personal agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Outside benchmarks (alfred.external). Install in their own environment: they pin their own dependencies.
external = ["agentdojo>=0.1.35", "bfcl-eval>=2026.3.23", "soundfile"]

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
